<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Modulus — home control panel</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <span class="boot-mark">m</span>
        <span class="boot-text">Loading Modulus…</span>
      </div>
    </div>

    <!-- React + Babel + marked, vendored under vendor/ (not loaded from a CDN).
         No build step: .jsx files are still transpiled in the browser, so the
         panel ships as a single static bundle a Pi serves without a toolchain —
         and now it works fully offline, with a CSP that names no third-party
         origin. To update a library, replace the file in src/panel/web/vendor/
         (versions are pinned in this comment): react 18.3.1, react-dom 18.3.1,
         @babel/standalone 7.29.0, marked 12.0.2. -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <script src="vendor/marked.min.js"></script>

    <script src="api.js"></script>
    <script type="text/babel" src="data.jsx"></script>
    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel" src="chathub.jsx"></script>
    <script type="text/babel" src="agentchat.jsx"></script>
    <script type="text/babel" src="agents.jsx"></script>
    <script type="text/babel" src="builder.jsx"></script>
    <script type="text/babel" src="voicehub.jsx"></script>
    <script type="text/babel" src="modules.jsx"></script>
    <script type="text/babel" src="settings.jsx"></script>
    <script type="text/babel" src="system.jsx"></script>
    <script type="text/babel" src="wizard.jsx"></script>
    <script type="text/babel" src="dashboard.jsx"></script>
    <script type="text/babel" src="docs.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
